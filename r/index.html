<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A soup review on Soup Reviews</title>
  <meta name="description" content="See this bowl on Soup Reviews — rate soups, find soup spots near you, and settle the daily “is it soup?” debate." />
  <meta property="og:title" content="A soup review on Soup Reviews 🍲" />
  <meta property="og:description" content="Rate soups, find soup spots near you, and settle the daily “is it soup?” debate." />
  <meta property="og:image" content="https://isaacsutherland1-max.github.io/soupreviews-support/icon.png" />
  <meta name="apple-itunes-app" content="app-id=6764480672" />
  <link rel="icon" href="../icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5edd8; color: #1a1208; min-height: 100vh; }
    header { background: #1b3a2d; color: #f5edd8; padding: 18px 16px; text-align: center; font-weight: 800; font-size: 18px; }
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
    .card { background: #fffaf0; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 14px rgba(27,58,45,0.12); }
    .photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #e8dcc0; }
    .body { padding: 18px 18px 20px; }
    h1 { font-size: 26px; font-weight: 800; color: #1b3a2d; line-height: 1.2; }
    .meta { margin-top: 8px; font-size: 15px; color: #6b5a3e; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
    .stars { color: #c9a027; font-size: 18px; letter-spacing: 1px; }
    .who { background: #1b3a2d; color: #fff; border-radius: 12px; padding: 2px 10px; font-weight: 700; font-size: 13px; }
    .notes { margin-top: 14px; font-size: 16px; line-height: 1.6; color: #3d2e1a; white-space: pre-wrap; overflow-wrap: anywhere; }
    .cta { display: block; margin-top: 22px; background: #1b3a2d; color: #fff; text-align: center; text-decoration: none; font-weight: 800; font-size: 17px; padding: 16px; border-radius: 14px; }
    .open { display: block; margin-top: 10px; text-align: center; color: #1b3a2d; font-weight: 700; font-size: 15px; padding: 10px; text-decoration: none; }
    .pitch { margin-top: 26px; text-align: center; color: #6b5a3e; font-size: 15px; line-height: 1.6; }
    .muted { text-align: center; color: #8a7655; padding: 40px 10px; font-size: 16px; }
    footer { text-align: center; color: #8a7655; font-size: 13px; padding: 8px 16px 28px; }
    footer a { color: #1b3a2d; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #12261d; color: #f5edd8; }
      .card { background: #1b3a2d; box-shadow: none; }
      h1 { color: #f5edd8; }
      .meta, .pitch, .muted, footer { color: #c9bb9a; }
      .notes { color: #efe5cc; }
      .who { background: #c9a027; color: #1b3a2d; }
      .cta { background: #c9a027; color: #1b3a2d; }
      .open, footer a { color: #f5edd8; }
    }
  </style>
</head>
<body>
<header>🍲 Soup Reviews</header>
<main>
  <div id="content"><p class="muted">Loading this bowl…</p></div>
  <a class="cta" href="https://apps.apple.com/us/app/soupreviews/id6764480672">Get Soup Reviews — free on the App Store</a>
  <a class="open" id="open" href="soupreviews://">Already have it? Open in the app</a>
  <p class="pitch">Rate every bowl, find soup spots near you, and settle the daily “is it soup?” debate with friends.</p>
</main>
<footer><a href="../index.html">Support</a> · <a href="../terms.html">Terms</a> · <a href="../privacy.html">Privacy</a></footer>
<script>
  // Shared-review landing page. Reads one public review with the app's
  // publishable (anon) key; RLS hides auto-hidden/reported reviews.
  // All review text is inserted with textContent — never innerHTML.
  (function () {
    var SUPABASE_URL = 'https://dcrzrapbrnlhyqqkkpux.supabase.co';
    var KEY = 'sb_publishable_7BJp2L_qnjrXSW5mOuOhww_D_DZSWDT';
    var box = document.getElementById('content');
    var id = new URLSearchParams(location.search).get('id') || '';
    function msg(text) { box.innerHTML = ''; var p = document.createElement('p'); p.className = 'muted'; p.textContent = text; box.appendChild(p); }
    if (!/^[0-9a-f-]{36}$/i.test(id)) { msg('This review link looks incomplete — but there’s plenty more soup in the app.'); return; }
    document.getElementById('open').href = 'soupreviews://review/' + id;
    var cols = 'soup_name,reviewer,rating,notes,photo_url,restaurant_name,location,created_at';
    fetch(SUPABASE_URL + '/rest/v1/reviews?select=' + cols + '&id=eq.' + id + '&limit=1', {
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
    }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
      var r = rows && rows[0];
      if (!r) { msg('This review isn’t available anymore — but there’s plenty more soup in the app.'); return; }
      document.title = (r.soup_name || 'A soup') + ' — Soup Reviews';
      box.innerHTML = '';
      var card = document.createElement('div'); card.className = 'card';
      var photoOk = typeof r.photo_url === 'string' && r.photo_url.indexOf(SUPABASE_URL + '/storage/v1/object/public/') === 0;
      if (photoOk) { var img = document.createElement('img'); img.className = 'photo'; img.alt = r.soup_name || 'Soup photo'; img.src = r.photo_url; card.appendChild(img); }
      var body = document.createElement('div'); body.className = 'body';
      var h = document.createElement('h1'); h.textContent = r.soup_name || 'A bowl of soup'; body.appendChild(h);
      var meta = document.createElement('div'); meta.className = 'meta';
      var n = Math.max(0, Math.min(5, r.rating | 0));
      var stars = document.createElement('span'); stars.className = 'stars'; stars.textContent = '★'.repeat(n) + '☆'.repeat(5 - n); stars.setAttribute('aria-label', n + ' out of 5 stars'); meta.appendChild(stars);
      if (r.reviewer) { var who = document.createElement('span'); who.className = 'who'; who.textContent = r.reviewer; meta.appendChild(who); }
      var place = r.restaurant_name || r.location;
      if (place) { var pl = document.createElement('span'); pl.textContent = '📍 ' + place; meta.appendChild(pl); }
      body.appendChild(meta);
      if (r.notes) { var notes = document.createElement('p'); notes.className = 'notes'; notes.textContent = '“' + r.notes + '”'; body.appendChild(notes); }
      card.appendChild(body); box.appendChild(card);
    }).catch(function () { msg('Couldn’t load this review right now — try again in a moment.'); });
  })();
</script>
</body>
</html>
